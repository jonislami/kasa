# Builds the Android app (debug APK) to catch native compile errors before a release.
# Nothing is published: the APK stays as a workflow artifact for 7 days.
name: Android check

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'android/**'
      - 'src/lib/device/**'
      - '.github/workflows/android-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - name: Build the web app and copy it into Android
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: check-build-only
        run: npm run build && npx cap sync android
      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kasa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
