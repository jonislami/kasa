# Builds and publishes the downloadable apps when a version tag is pushed (e.g. v0.2.0):
#   Windows: Kasa-Setup-<version>.exe (+ latest.yml for auto-update) → GitHub Release
#   Android: Kasa-<version>.apk → the same GitHub Release
# The web version (Vercel) deploys from main on its own.
#
# Secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   – baked into the build (same as .env.local)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     – optional: sign the APK with your release key (needed for Play Store). Without them the
#       APK is signed with a debug key (installs fine as a direct download, cannot go to Play Store).
name: Release apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish the Windows installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build the web app and copy it into Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build && npx cap sync android
      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../package.json').version")
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../Kasa-$VERSION.apk
            cp app/build/outputs/bundle/release/app-release.aab ../Kasa-$VERSION.aab
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Kasa-$VERSION.apk
          fi
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" Kasa-$VERSION.apk --clobber
          if [ -f Kasa-$VERSION.aab ]; then gh release upload "v$VERSION" Kasa-$VERSION.aab --clobber; fi
