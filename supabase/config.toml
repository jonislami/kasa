project_id = "slleolfhjpvebleqirdm"

# The function checks the user's token itself (auth.getUser) and then platform_admins,
# so the gateway's legacy-secret JWT check is not needed (and fails with the new signing keys).
[functions.platform-admin]
verify_jwt = false

# Checks the caller's token itself (auth.getUser) and their role in the business.
[functions.business-users]
verify_jwt = false

# Public: the credential is the device secret + the worker's PIN (checked in SQL).
[functions.pin-login]
verify_jwt = false

# Checks the caller's token itself (auth.getUser) and the business; forwards signed data to ATK (no CORS there).
[functions.fiscal-relay]
verify_jwt = false
