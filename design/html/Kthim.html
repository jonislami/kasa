lign-items: flex-start\">\n<div style=\"flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<section class=\"card\" aria-labelledby=\"k-1\">\n<h2 id=\"k-1\" style=\"margin: 0; font-size: 16px; font-weight: 700\">1. Gjej faturën<\/h2>\n<div style=\"display: flex; gap: 10px\">\n<label style=\"flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border: 2px solid #0E6B4E; border-radius: 10px; box-sizing: border-box\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#56645C\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-4-4\"/><\/svg><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Numri i faturës<\/span><input type=\"text\" value=\"01284\" style=\"flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; font-weight: 600; background: transparent; color: #14201A\"><\/label>\n<button style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 10px; border: 1px solid #CBD5CE; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #14201A\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3\"/><path d=\"M7 8v8M10 8v8M13 8v8M17 8v8\"/><\/svg>Skano faturën<\/button>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: #56645C; background: #F7F9F7; border-radius: 10px; padding: 10px 12px\"><span><strong style=\"color: #14201A\">#01284<\/strong> · 05.11.2026 10:42 · Liridona K.<\/span><span>Totali €7.85 · Kesh + Kartelë<\/span><\/div>\n<\/section>\n\n<section class=\"card\" aria-labelledby=\"k-2\">\n<h2 id=\"k-2\" style=\"margin: 0; font-size: 16px; font-weight: 700\">2. Zgjidh artikujt që kthehen<\/h2>\n<sc-for list=\"{{items}}\" as=\"it\" hint-placeholder-count=\"4\">\n<div class=\"it {{it.cls}}\">\n<button class=\"ck\" aria-label=\"Zgjidh {{it.name}}\" aria-pressed=\"{{it.pressed}}\" onClick=\"{{it.toggle}}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5L20 7\"/><\/svg><\/button>\n<span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 15px; font-weight: 600\">{{it.name}}<\/span><span style=\"font-size: 12px; color: #56645C\">Blerë {{it.max}} · {{it.priceLbl}} / copë<\/span><\/span>\n<span style=\"display: flex; align-items: center; gap: 8px\"><button class=\"q\" aria-label=\"Zvogëlo\" onClick=\"{{it.dec}}\">−<\/button><span style=\"width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums\">{{it.qty}}<\/span><button class=\"q\" aria-label=\"Rrit\" onClick=\"{{it.inc}}\">+<\/button><\/span>\n<span style=\"width: 70px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums\">{{it.lineLbl}}<\/span>\n<\/div>\n<\/sc-for>\n<\/section>\n\n<section class=\"card\" aria-labelledby=\"k-3\">\n<h2 id=\"k-3\" style=\"margin: 0; font-size: 16px; font-weight: 700\">3. Arsyeja<\/h2>\n<div role=\"group\" aria-label=\"Arsyeja e kthimit\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button class=\"rs on\">Produkt i dëmtuar<\/button><button class=\"rs\">Afati ka skaduar<\/button><button class=\"rs\">Gabim në arkë<\/button><button class=\"rs\">Klienti ndërroi mendje<\/button><button class=\"rs\">Tjetër<\/button>\n<\/div>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #33413A\">Shënim (opsional)<input type=\"text\" placeholder=\"p.sh. shishja ishte e çarë\" style=\"min-height: 44px; border: 1px solid #CBD5CE; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #14201A\"><\/label>\n<label style=\"display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px\"><input type=\"checkbox\" checked style=\"width: 20px; height: 20px; accent-color: #0E6B4E\">Ktheje mallin në stok<\/label>\n<\/section>\n<\/div>\n\n<aside aria-labelledby=\"k-sum\" style=\"flex: 1 1 320px; background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box\">\n<h2 id=\"k-sum\" style=\"margin: 0; font-size: 17px; font-weight: 700\">Përmbledhje e kthimit<\/h2>\n<div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px\">\n<div style=\"display: flex; justify-content: space-between; color: #56645C\"><span>Artikuj<\/span><span style=\"font-variant-numeric: tabular-nums\">{{count}}<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; color: #56645C\"><span>TVSH që kthehet<\/span><span style=\"font-variant-numeric: tabular-nums\">{{vatLbl}}<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px dashed #CBD5CE\"><span style=\"font-weight: 600\">Kthehen klientit<\/span><span style=\"font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums\">{{totalLbl}}<\/span><\/div>\n<\/div>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #33413A\">Mënyra e kthimit<select style=\"min-height: 44px; border: 1px solid #CBD5CE; border-radius: 10px; padding: 0 10px; font: inherit; font-size: 14px; color: #14201A; background: #FFFFFF\"><option>Kesh<\/option><option>Në kartelë<\/option><\/select><\/label>\n<p style=\"margin: 0; font-size: 12px; line-height: 1.5; color: #56645C\">Kthimi lëshon kupon fiskal me shuma negative, i lidhur me faturën #01284.<\/p>\n<button style=\"min-height: 56px; border-radius: 12px; border: 0; background: #0E6B4E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700\">Konfirmo kthimin · {{totalLbl}}<\/button>\n<a href=\"Arka.html\" style=\"display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; border: 1px solid #CBD5CE; color: #14201A; text-decoration: none; font-size: 14px; font-weight: 600\">Anulo<\/a>\n<\/aside>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1000}}'>\nclass Component extends DCLogic {\nconstructor(props) { super(props); this.state = { q: { m: 0, b: 0, k: 1, u: 2 } }; }\nrenderVals() {\nconst base = [\n{ id: 'm', name: 'Qumësht i freskët 1L', max: 2, price: 0.95, vat: 8 },\n{ id: 'b', name: 'Bukë e bardhë 500g', max: 1, price: 0.50, vat: 8 },\n{ id: 'k', name: 'Kafe e bluar 200g', max: 1, price: 2.75, vat: 18 },\n{ id: 'u', name: 'Ujë mineral 1.5L', max: 6, price: 0.45, vat: 18 }\n];\nconst q = this.state.q;\nconst eur = (n) => '€' + n.toFixed(2);\nconst set = (id, v) => this.setState({ q: { ...q, [id]: v } });\nlet total = 0, vat = 0, count = 0;\nconst items = base.map((b) => {\nconst qty = q[b.id];\nconst line = Math.round(b.price * qty * 100) / 100;\ntotal += line; vat += line - line / (1 + b.vat / 100); count += qty;\nreturn {\nname: b.name, max: b.max, qty, priceLbl: eur(b.price), lineLbl: qty ? '−' + eur(line) : '—',\ncls: qty ? 'on' : '', pressed: qty ? 'true' : 'false',\ntoggle: () => set(b.id, qty ? 0 : b.max),\ninc: () => set(b.id, Math.min(b.max, qty + 1)),\ndec: () => set(b.id, Math.max(0, qty - 1))\n};\n});\nreturn { items, count, totalLbl: eur(total), vatLbl: eur(Math.round(vat * 100) / 100) };\n}\n}\n<\/script>\n<\/body>\n<\/html>\n"};</script>
