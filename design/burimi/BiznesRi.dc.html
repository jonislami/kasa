<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Biznes i ri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#7F8C85}
a{color:#0E6B4E}a:hover{color:#0A5039}
.tc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:112px;border:1px solid #CBD5CE;border-radius:12px;background:#FFFFFF;font:inherit;color:#14201A;text-align:left;cursor:pointer}
.tc:hover{border-color:#0E6B4E}
.tc.on{border:2px solid #0E6B4E;background:#F0F7F3;padding:13px}
.tc .ic{width:36px;height:36px;border-radius:10px;background:#E3F1EA;color:#0E6B4E;display:flex;align-items:center;justify-content:center}
.tc.on .ic{background:#0E6B4E;color:#FFFFFF}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#33413A}
.inp{min-height:46px;border:1px solid #CBD5CE;border-radius:10px;padding:0 12px;font:inherit;font-size:15px;color:#14201A;background:#FFFFFF;box-sizing:border-box;width:100%}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #14201A; min-height: 100vh; background: #7F8C85; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box">

<section role="dialog" aria-modal="true" aria-labelledby="dlg-t" style="width: 100%; max-width: 720px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 30px 80px rgba(16,36,27,.35); display: flex; flex-direction: column">
<header style="padding: 22px 24px; border-bottom: 1px solid #EEF1EE; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h1 id="dlg-t" style="margin: 0; font-size: 20px; font-weight: 700">Biznes i ri</h1><span style="font-size: 13px; color: #56645C">Krijo llogarinë dhe përdoruesin e parë (pronarin)</span></div>
<a href="Platforma.dc.html" aria-label="Mbyll" style="width: 44px; height: 44px; border-radius: 10px; background: #F0F3F1; color: #33413A; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px">×</a>
</header>

<div style="padding: 24px; display: flex; flex-direction: column; gap: 22px">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 10px">1. Lloji i biznesit</legend>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
<button class="tc {{c.market}}" aria-pressed="{{p.market}}" onClick="{{pick.market}}"><span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/></svg></span><span style="font-size: 14px; font-weight: 700">Market</span><span style="font-size: 12px; color: #56645C; line-height: 1.35">Barkod, stok, furnitorë</span></button>
<button class="tc {{c.resto}}" aria-pressed="{{p.resto}}" onClick="{{pick.resto}}"><span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg></span><span style="font-size: 14px; font-weight: 700">Kafiterie / Restorant</span><span style="font-size: 12px; color: #56645C; line-height: 1.35">Tavolina, kuzhinë</span></button>
<button class="tc {{c.pharma}}" aria-pressed="{{p.pharma}}" onClick="{{pick.pharma}}"><span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg></span><span style="font-size: 14px; font-weight: 700">Barnatore</span><span style="font-size: 12px; color: #56645C; line-height: 1.35">Seri, afat skadimi</span></button>
<button class="tc {{c.boutique}}" aria-pressed="{{p.boutique}}" onClick="{{pick.boutique}}"><span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg></span><span style="font-size: 14px; font-weight: 700">Butik</span><span style="font-size: 12px; color: #56645C; line-height: 1.35">Madhësi, ngjyra</span></button>
<button class="tc {{c.salon}}" aria-pressed="{{p.salon}}" onClick="{{pick.salon}}"><span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg></span><span style="font-size: 14px; font-weight: 700">Sallon</span><span style="font-size: 12px; color: #56645C; line-height: 1.35">Termine, punëtorë</span></button>
</div>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #854D0E; background: #FEF3C7; border-radius: 10px; padding: 10px 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Lloji nuk ndryshohet më pasi të krijohet biznesi.</p>
</fieldset>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 14px">2. Biznesi dhe pronari</legend>
<label class="fld">Emri i biznesit<input class="inp" type="text" value="Market Lisi"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<label class="fld">Emri i pronarit<input class="inp" type="text" value="Blerim Hasani"></label>
<label class="fld">Email-i i hyrjes<input class="inp" type="email" value="blerim@marketlisi.com"></label>
</div>
<label class="fld">Fjalëkalimi (gjenerohet automatikisht)
<span style="display: flex; gap: 8px">
<input class="inp" type="text" readonly value="{{password}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; letter-spacing: .04em; background: #F7F9F7">
<button onClick="{{regen}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid #CBD5CE; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #14201A; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Rigjenero</button>
</span>
</label>
</fieldset>
</div>

<footer style="padding: 18px 24px; border-top: 1px solid #EEF1EE; background: #F7F9F7; border-radius: 0 0 18px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="font-size: 13px; color: #56645C">Lloji i zgjedhur: <strong style="color: #14201A">{{typeName}}</strong></span>
<span style="display: flex; gap: 10px">
<a href="Platforma.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid #CBD5CE; background: #FFFFFF; color: #14201A; text-decoration: none; font-size: 14px; font-weight: 600">Anulo</a>
<a href="Kredencialet.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 10px; background: #0E6B4E; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700">Krijo biznesin</a>
</span>
</footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { type: 'market', pw: 0 }; }
renderVals() {
const ids = ['market', 'resto', 'pharma', 'boutique', 'salon'];
const names = { market: 'Market', resto: 'Kafiterie / Restorant', pharma: 'Barnatore', boutique: 'Butik', salon: 'Sallon' };
const pws = ['Kx7#mP2vQa', 'Rt4$nB9wLe', 'Hq8@zV3sJd', 'Wn5!cT6yFu'];
const c = {}, p = {}, pick = {};
ids.forEach((id) => { const on = this.state.type === id; c[id] = on ? 'on' : ''; p[id] = on ? 'true' : 'false'; pick[id] = () => this.setState({ type: id }); });
return {
c, p, pick,
typeName: names[this.state.type],
password: pws[this.state.pw % pws.length],
regen: () => this.setState({ pw: this.state.pw + 1 })
};
}
}
</script>
</body>
</html>
