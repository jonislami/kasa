<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Telefon – Paneli i punëtorit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B4E}a:hover{color:#0A5039}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:12px;font-weight:500;color:#56645C;text-decoration:none}
.tb.on{color:#0E6B4E;font-weight:700}
.k{background:#FFFFFF;border:1px solid #E2E7E3;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.rw{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #EEF1EE;font-size:14px}
.rw.f{border-top:0}
.bd{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap}
.b-ok{color:#0E6B4E;background:#E3F1EA}.b-w{color:#854D0E;background:#FEF3C7}.b-x{color:#9A3412;background:#FFEDE0}.b-n{color:#33413A;background:#F0F3F1}
.c-m{background:#3FBF86}.c-r{background:#93C5FD}.c-s{background:#C4B5FD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14201A; background: #F4F6F3; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 52px 16px 18px; background: #10241B; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px"><span class="{{color}}" style="width: 44px; height: 44px; border-radius: 50%; color: #10241B; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ini}}</span><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 18px">Mirëmëngjes, {{first}}</strong><span style="font-size: 12px; color: #8FA79A">{{biz}} · {{role}}</span></span><a href="M-Ballina.dc.html" style="font-size: 12px; font-weight: 600; color: #6EE7B0; min-height: 44px; display: inline-flex; align-items: center">Dil</a></div>
<a href="{{ctaHref}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 88px; padding: 0 20px; border-radius: 18px; background: #3FBF86; color: #10241B; text-decoration: none"><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 22px">{{cta}}</strong><span style="font-size: 13px; font-weight: 500">{{ctaSub}}</span></span><span aria-hidden="true" style="font-size: 34px; font-weight: 700">+</span></a>
</header>
<div style="flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; font-weight: 700">Puna ime sot</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><div class="k"><span style="font-size: 12px; color: #56645C">{{k.l}}</span><span style="font-size: 19px; font-weight: 700">{{k.v}}</span><span style="font-size: 11px; color: #56645C">{{k.s}}</span></div></sc-for>
</div>
<section aria-labelledby="mpu-l" style="background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 14px; padding: 10px 14px">
<h2 id="mpu-l" style="margin: 0 0 4px; font-size: 14px; font-weight: 700">{{listTitle}}</h2>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div class="rw {{r.f}}"><strong style="width: 54px">{{r.a}}</strong><span style="flex: 1; min-width: 0; font-size: 13px">{{r.b}}</span><span class="bd {{r.bc}}">{{r.d}}</span></div></sc-for>
</section>
</div>
<nav aria-label="Menuja e punëtorit" style="display: flex; background: #FFFFFF; border-top: 1px solid #E2E7E3; padding: 6px 8px 22px">
<a href="{{ctaHref}}" class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/></svg>{{arkaLbl}}</a>
<a href="M-Punetori.dc.html" class="tb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Puna ime</a>
<a href="M-ATK.dc.html" class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v8H6z"/></svg>Printeri</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lloji":{"editor":"enum","options":["market","restorant","sallon"],"default":"market"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const t = this.props.lloji ?? 'market';
const D = {
market: { first: 'Liridona', ini: 'LK', color: 'c-m', biz: 'Market Fllanza', role: 'Arka 1', arkaLbl: 'Arka', cta: 'Shitje e re', ctaSub: 'Skano produktin e parë', ctaHref: 'M-K-Arka.dc.html',
kpis: [['Fatura', '48', 'mesatarja €14.30'], ['Totali', '€686.40', 'kesh €512.10'], ['Kthime', '1', 'miratuar'], ['Orët', '3:22', 'nga 07:58']], listTitle: 'Faturat e mia',
rows: [['#01284', '10:42 · Kesh + Kartelë · €7.85', 'Dërguar', 'b-ok'], ['#01283', '10:38 · Kartelë · €23.15', 'Dërguar', 'b-ok'], ['Kthim', '10:51 · −€3.65', 'Miratuar', 'b-w']] },
restorant: { first: 'Driton', ini: 'DB', color: 'c-r', biz: 'Restorant Te Ura', role: 'Kamarier', arkaLbl: 'Tavolinat', cta: 'Porosi e re', ctaSub: 'Zgjidh tavolinën', ctaHref: 'M-R-Tavolinat.dc.html',
kpis: [['Tavolina të hapura', '4', 'T1, T3, T7, T9'], ['Porosi', '17', 'të dërguara'], ['Totali i mbyllur', '€412.80', '11 llogari'], ['Orët', '4:15', 'nga 16:00']], listTitle: 'Tavolinat e mia',
rows: [['T7', '€126.50 · 1 orë 24 min', 'Në kuzhinë', 'b-w'], ['T9', '€54.60 · 41 min', '2 pa dërguar', 'b-x'], ['T1', '€42.80 · 58 min', 'Shërbyer', 'b-ok']] },
sallon: { first: 'Arta', ini: 'A', color: 'c-s', biz: 'Sallon Bukuria', role: 'Flokë · 40%', arkaLbl: 'Arka', cta: 'Termini 11:00', ctaSub: 'Donika Shala · Prerje & fen', ctaHref: 'M-S-Terminet.dc.html',
kpis: [['Shërbime', '1 / 4', 'të kryera'], ['Totali', '€35.00', 'deri tani'], ['Komisioni im', '€14.00', 'tetor €1,136.00'], ['Orët', '2:40', 'nga 08:40']], listTitle: 'Terminet e mia',
rows: [['09:00', 'Merita K. · Ngjyrosje', 'I kryer', 'b-ok'], ['11:00', 'Donika S. · Prerje & fen', 'Ka ardhur', 'b-w'], ['14:00', 'Teuta H. · Fen me valë', 'I rezervuar', 'b-n'], ['16:30', 'Leonora B. · Prerje & fen', 'I rezervuar', 'b-n']] }
}[t];
return { ...D, kpis: D.kpis.map(([l, v, s]) => ({ l, v, s })), rows: D.rows.map(([a, b, d, bc], i) => ({ a, b, d, bc, f: i === 0 ? 'f' : '' })) };
}
}
</script>
</body>
</html>
