<!doctype html>

<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B4E}a:hover{color:#0A5039}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:11px;font-weight:500;color:#56645C;text-decoration:none}
.tb.on{color:#0E6B4E;font-weight:700}
.st{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 4px;border-radius:999px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#14201A;flex-shrink:0}
.st.on{border:2px solid #14201A;padding:0 11px 0 3px}
.av{width:28px;height:28px;border-radius:50%;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k1{background:#7C3AED}.k2{background:#BE185D}.k3{background:#0369A1}
.sv{flex-shrink:0;min-height:56px;padding:0 14px;border-radius:12px;border:1px solid #E2E7E3;background:#FFFFFF;font:inherit;color:#14201A;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.ln{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #EEF1EE}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px 0 3px;border-radius:999px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:12px;font-weight:600;color:#14201A}
.dot{width:24px;height:24px;border-radius:50%;color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14201A; background: #F4F6F3; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 52px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 20px; font-weight: 700">Fatura #00612</h1><span style="font-size: 12px; color: #56645C">Donika Shala · termini 11:00</span></div></div>
<div role="group" aria-label="Punëtori" style="display: flex; gap: 8px; overflow-x: auto"><button class="st {{c.a}}" onClick="{{pick.a}}"><span class="av k1">A</span>Arta</button><button class="st {{c.b}}" onClick="{{pick.b}}"><span class="av k2">B</span>Blerina</button><button class="st {{c.d}}" onClick="{{pick.d}}"><span class="av k3">D</span>Dren</button></div>
</header>
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; flex-shrink: 0">
<button class="sv"><strong style="font-size: 13px">Prerje &amp; fen</strong><span style="font-size: 12px; color: #56645C">€15 · 45 min</span></button>
<button class="sv"><strong style="font-size: 13px">Ngjyrosje</strong><span style="font-size: 12px; color: #56645C">€35 · 90 min</span></button>
<button class="sv"><strong style="font-size: 13px">Manikyr</strong><span style="font-size: 12px; color: #56645C">€20 · 60 min</span></button>
<button class="sv"><strong style="font-size: 13px">Vetulla</strong><span style="font-size: 12px; color: #56645C">€12 · 45 min</span></button>
</div>
<div style="flex: 1; overflow-y: auto; padding: 0 16px">
<div style="background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 14px; padding: 0 14px">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div class="ln"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">{{l.name}}</span><span><button class="pill" onClick="{{l.cycle}}" aria-label="Ndrysho punëtorin"><span class="dot {{l.k}}">{{l.ini}}</span>{{l.staff}} ▾</button></span></span><strong>{{l.price}}</strong></div>
</sc-for>
</div>
</div>
<div style="background: #FFFFFF; border-top: 1px solid #E2E7E3; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #56645C">Totali · TVSH €5.42</span><span style="font-size: 22px; font-weight: 700">€35.50</span></span>
<button style="flex: 1; min-height: 52px; border-radius: 12px; border: 0; background: #0E6B4E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Paguaj</button>
</div>
<nav aria-label="Menuja kryesore" style="display: flex; background: #FFFFFF; border-top: 1px solid #E2E7E3; padding: 6px 8px 22px">

<a href="M-S-Terminet.dc.html" class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Terminet</a>
<a href="M-S-Arka.dc.html" class="tb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/></svg>Arka</a>
<a href="M-S-Punetoret.dc.html" class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/></svg>Punëtorët</a>
<a href="M-Raportet.dc.html" class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Më shumë</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cur: 'a', ls: ['a', 'b', 'a'] }; }
renderVals() {
const S = { a: ['Arta', 'A', 'k1'], b: ['Blerina', 'B', 'k2'], d: ['Dren', 'D', 'k3'] };
const order = ['a', 'b', 'd'];
const base = [['Prerje & fen', '€15.00'], ['Vetulla & qerpikë', '€12.00'], ['Shampo profesionale 250ml', '€8.50']];
const c = {}, pick = {};
order.forEach((k) => { c[k] = this.state.cur === k ? 'on' : ''; pick[k] = () => this.setState({ cur: k }); });
const lines = base.map((b, i) => { const s = S[this.state.ls[i]]; return { name: b[0], price: b[1], staff: s[0], ini: s[1], k: s[2], cycle: () => { const ls = this.state.ls.slice(); ls[i] = order[(order.indexOf(ls[i]) + 1) % 3]; this.setState({ ls }); } }; });
return { c, pick, lines };
}
}
</script>
</body>
</html>
