<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { col: 'z' }; }
renderVals() {
const sizes = ['XS', 'S', 'M', 'L', 'XL'];
const C = { z: ['01', [2, 4, 5, 3, 1]], k: ['02', [0, 2, 3, 2, 0]], b: ['03', [1, 3, 0, 4, 1]] };
const [code, qs] = C[this.state.col];
const rows = qs.map((q, i) => ({ size: sizes[i], code: '2001234' + code + '0' + (i + 1), q, cls: q === 0 ? 'zero' : q === 1 ? 'low' : '', note: q === 0 ? 'Mungon – porosit' : q === 1 ? 'Copa e fundit' : 'Në stok', first: i === 0 ? 'f' : '' }));
const c = {}, p = {};
['z', 'k', 'b'].forEach((k) => { c[k] = this.state.col === k ? 'on' : ''; p[k] = () => this.setState({ col: k }); });
return { rows, c, p, total: qs.reduce((a, b) => a + b, 0) };
}
}
</script>
