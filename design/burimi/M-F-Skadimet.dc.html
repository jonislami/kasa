<helmet>

<style>
body{margin:0}
a{color:#0E6B4E}a:hover{color:#0A5039}

.d-x{color:#9A3412;background:#FFEDE0}.d-30{color:#854D0E;background:#FEF3C7}.d-60{color:#33413A;background:#F0F3F1}
.rx{font-size:10px;font-weight:700;color:#1D4ED8;background:#E8F0FB;padding:2px 5px;border-radius:4px;margin-left:6px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14201A; background: #F4F6F3; display: flex; flex-direction: column; overflow: hidden">

</header>
<div role="group" aria-label="Filtri" style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; flex-shrink: 0"><button class="chip {{c.x}}" onClick="{{f.x}}">Të skaduara 3</button><button class="chip {{c.d30}}" onClick="{{f.d30}}">≤ 30 ditë 5</button><button class="chip {{c.d60}}" onClick="{{f.d60}}">≤ 60 ditë 8</button><button class="chip {{c.d90}}" onClick="{{f.d90}}">≤ 90 ditë 12</button></div>
<div style="flex: 1; overflow-y: auto; padding: 0 16px 12px">
<div style="background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 14px; padding: 0 14px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div class="rw {{r.f}}"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{r.n}}<sc-if value="{{r.rx}}" hint-placeholder-val="{{ false }}"><span class="rx">Rx</span></sc-if></span><span style="font-size: 12px; color: #56645C">{{r.s}} · <span style="font-family: 'IBM Plex Mono', monospace">{{r.lot}}</span> · {{r.q}} copë</span></span><span class="d {{r.dc}}">{{r.left}}</span></div>
</sc-for>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { f: 'x' }; }
renderVals() {
const X = [['Ibuprofen sirup 100ml', 'ibuprofen', 'IS2210', 4, 'Skaduar 5 ditë', false, 'd-x'], ['Salbutamol inhalator', 'salbutamol', 'SB0915', 2, 'Skaduar 8 ditë', true, 'd-x'], ['Kremë hidrokortizon 1%', 'hidrokortizon', 'HK7730', 3, 'Skaduar 21 ditë', false, 'd-x']];
const D30 = [['Amoksicilinë 500mg', 'amoksicilinë', 'AX4410', 6, '15 ditë', true, 'd-30'], ['Paracetamol sirup 120ml', 'paracetamol', 'PS3318', 5, '20 ditë', false, 'd-30'], ['Loratadinë 10mg', 'loratadinë', 'LR6620', 8, '25 ditë', false, 'd-30'], ['Metformin 850mg', 'metformin', 'MF1190', 10, '27 ditë', true, 'd-30'], ['Vitaminë D3 1000 IU', 'kolekalciferol', 'VD5501', 7, '29 ditë', false, 'd-30']];
const D60 = D30.concat([['Omeprazol 20mg', 'omeprazol', 'OM2207', 9, '44 ditë', false, 'd-60'], ['Amoksicilinë 500mg', 'amoksicilinë', 'AX5520', 20, '53 ditë', true, 'd-60'], ['Pika për sy 10ml', 'natrium hialuronat', 'SY4402', 4, '58 ditë', false, 'd-60']]);
const D90 = D60.concat([['Ibuprofen 400mg', 'ibuprofen', 'IB8810', 12, '68 ditë', false, 'd-60'], ['Atorvastatin 20mg', 'atorvastatin', 'AT3301', 6, '76 ditë', true, 'd-60'], ['Magnez 375mg', 'magnez', 'MG7712', 10, '81 ditë', false, 'd-60'], ['Spray për hundë', 'ksilometazolinë', 'XS1180', 5, '86 ditë', false, 'd-60']]);
const L = { x: X, d30: D30, d60: D60, d90: D90 }[this.state.f];
const rows = L.map((r, i) => ({ n: r[0], s: r[1], lot: r[2], q: r[3], left: r[4], rx: r[5], dc: r[6], f: i === 0 ? 'f' : '' }));
const c = {}, f = {};
['x', 'd30', 'd60', 'd90'].forEach((k) => { c[k] = this.state.f === k ? 'on' : ''; f[k] = () => this.setState({ f: k }); });
return { rows, c, f };
}
}
