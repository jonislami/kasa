<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Telefon – Ekrani i kuzhinës</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6EE7B0}a:hover{color:#A7F3D0}
.sb{flex:1;border:0;min-height:40px;border-radius:9px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:#B5C7BD}
.sb.on{background:#FFFFFF;color:#10241B}
.tk{background:#FFFFFF;border-radius:14px;overflow:hidden;color:#14201A}
.hd{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.h-ok{background:#E3F1EA;color:#0F2A1F}.h-mid{background:#FEF3C7;color:#713F12}.h-late{background:#FFEDE0;color:#7C2D12}
.li{display:flex;gap:8px;padding:8px 14px;border-top:1px solid #EEF1EE;font-size:14px}
.mod{display:block;font-size:12px;color:#9A3412;font-weight:600}
.gt{width:calc(100% - 28px);margin:10px 14px 14px;min-height:48px;border-radius:10px;border:0;background:#0E6B4E;color:#FFFFFF;font:inherit;font-size:15px;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #10241B; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 52px 16px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="display: flex; align-items: center; gap: 4px"><a href="M-R-Tavolinat.dc.html" aria-label="Kthehu" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><h1 style="margin: 0; font-size: 20px; font-weight: 700">Në pritje · {{count}}</h1></div><span style="font-size: 20px; font-weight: 700">20:15</span></div>
<div role="group" aria-label="Stacioni" style="display: flex; background: #1B3A2C; border-radius: 12px; padding: 4px"><button class="sb on">Kuzhina</button><button class="sb">Bari</button></div>
</header>
<div style="flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{tickets}}" as="t" hint-placeholder-count="4">
<article class="tk">
<div class="hd {{t.hc}}"><span style="display: flex; flex-direction: column"><strong style="font-size: 18px">{{t.table}}</strong><span style="font-size: 11px; font-weight: 600">{{t.waiter}} · #{{t.no}}</span></span><strong style="font-size: 18px">{{t.wait}}</strong></div>
<sc-for list="{{t.items}}" as="i" hint-placeholder-count="2"><div class="li"><b style="width: 24px">{{i.q}}×</b><span>{{i.n}}<span class="mod">{{i.m}}</span></span></div></sc-for>
<button class="gt" onClick="{{t.done}}">Gati</button>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="text-align: center; color: #B5C7BD">Nuk ka porosi në pritje.</p></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { gone: {} }; }
renderVals() {
const T = [
{ id: 1, table: 'T7', waiter: 'Driton', no: '0418', wait: '24 min', hc: 'h-late', items: [{ q: 3, n: 'Tavë kosi', m: '' }, { q: 2, n: 'Pleskavicë', m: 'pa qepë' }, { q: 1, n: 'Fli me kos', m: '' }] },
{ id: 2, table: 'T13 · Terasa', waiter: 'Arbnora', no: '0421', wait: '14 min', hc: 'h-mid', items: [{ q: 2, n: 'Pica Margarita', m: 'ekstra djathë' }, { q: 1, n: 'Sallatë shope', m: '' }] },
{ id: 3, table: 'T9', waiter: 'Driton', no: '0424', wait: '6 min', hc: 'h-ok', items: [{ q: 1, n: 'Trilece', m: '' }] },
{ id: 4, table: 'T11 · Terasa', waiter: 'Arbnora', no: '0425', wait: '4 min', hc: 'h-ok', items: [{ q: 2, n: 'Byrek me spinaq', m: '' }, { q: 1, n: 'Pleskavicë', m: 'e pjekur mirë' }] }
];
const tickets = T.filter((t) => !this.state.gone[t.id]).map((t) => ({ ...t, done: () => this.setState({ gone: { ...this.state.gone, [t.id]: true } }) }));
return { tickets, count: tickets.length, empty: tickets.length === 0 };
}
}
</script>
</body>
</html>
