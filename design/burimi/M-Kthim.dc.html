<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Telefon – Kthim malli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B4E}a:hover{color:#0A5039}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E2E7E3;border-radius:12px;background:#FFFFFF}
.it.on{border:2px solid #0E6B4E;background:#F0F7F3;padding:9px 11px}
.ck{width:24px;height:24px;border-radius:6px;border:2px solid #CBD5CE;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:transparent}
.it.on .ck{border-color:#0E6B4E;background:#0E6B4E;color:#FFFFFF}
.q{width:34px;height:34px;border-radius:9px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:17px;color:#14201A}
.rs{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:13px;font-weight:500;color:#14201A;white-space:nowrap;flex-shrink:0}
.rs.on{background:#14201A;border-color:#14201A;color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14201A; background: #F4F6F3; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 52px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><a href="M-FaturaDetaje.dc.html" aria-label="Kthehu" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #14201A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><h1 style="margin: 0; font-size: 20px; font-weight: 700">Kthim malli</h1></div>
<div style="display: flex; gap: 8px">
<label style="flex: 1; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 12px; border: 1px solid #CBD5CE; border-radius: 12px; box-sizing: border-box"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Numri i faturës</span><span style="color: #56645C; font-weight: 600">#</span><input type="text" value="01284" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; font-weight: 600; background: transparent; color: #14201A"></label>
<button aria-label="Skano faturën" style="width: 46px; height: 46px; border-radius: 12px; border: 0; background: #0E6B4E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button>
</div>
<span style="font-size: 12px; color: #56645C">05.11 10:42 · Liridona K. · Totali €7.85</span>
</header>

<div style="flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700">Artikujt që kthehen</span>
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<div class="it {{it.cls}}">
<button class="ck" aria-label="Zgjidh {{it.name}}" aria-pressed="{{it.pressed}}" onClick="{{it.toggle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></button>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{it.name}}</span><span style="font-size: 12px; color: #56645C">nga {{it.max}} · {{it.lineLbl}}</span></span>
<button class="q" aria-label="Zvogëlo" onClick="{{it.dec}}">−</button><span style="width: 20px; text-align: center; font-weight: 700">{{it.qty}}</span><button class="q" aria-label="Rrit" onClick="{{it.inc}}">+</button>
</div>
</sc-for>
<span style="font-size: 13px; font-weight: 700; margin-top: 6px">Arsyeja</span>
<div role="group" aria-label="Arsyeja" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px"><button class="rs on">Produkt i dëmtuar</button><button class="rs">Afati ka skaduar</button><button class="rs">Gabim në arkë</button><button class="rs">Tjetër</button></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0E6B4E">Ktheje mallin në stok</label>
</div>

<footer style="background: #FFFFFF; border-top: 1px solid #E2E7E3; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #56645C">{{count}} artikuj · kesh</span><span style="font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">{{totalLbl}}</span></div>
<button style="min-height: 54px; border-radius: 12px; border: 0; background: #0E6B4E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Konfirmo kthimin</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { q: { m: 0, b: 0, k: 1, u: 2 } }; }
renderVals() {
const base = [
{ id: 'm', name: 'Qumësht i freskët 1L', max: 2, price: 0.95 },
{ id: 'b', name: 'Bukë e bardhë 500g', max: 1, price: 0.50 },
{ id: 'k', name: 'Kafe e bluar 200g', max: 1, price: 2.75 },
{ id: 'u', name: 'Ujë mineral 1.5L', max: 6, price: 0.45 }
];
const q = this.state.q;
const eur = (n) => '€' + n.toFixed(2);
const set = (id, v) => this.setState({ q: { ...q, [id]: v } });
let total = 0, count = 0;
const items = base.map((b) => {
const qty = q[b.id];
const line = Math.round(b.price * qty * 100) / 100;
total += line; count += qty;
return {
name: b.name, max: b.max, qty, lineLbl: qty ? '−' + eur(line) : eur(b.price) + ' / copë',
cls: qty ? 'on' : '', pressed: qty ? 'true' : 'false',
toggle: () => set(b.id, qty ? 0 : b.max),
inc: () => set(b.id, Math.min(b.max, qty + 1)),
dec: () => set(b.id, Math.max(0, qty - 1))
};
});
return { items, count, totalLbl: '−' + eur(total) };
}
}
</script>
</body>
</html>
