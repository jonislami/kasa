<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Telefon – Butik Arka</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B4E}a:hover{color:#0A5039}
.ln{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #EEF1EE}
.sz{min-width:56px;min-height:48px;border-radius:10px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:15px;font-weight:600;color:#14201A}
.sz.on{background:#14201A;border-color:#14201A;color:#FFFFFF}
.sz:disabled{color:#A3ADA7;background:#F7F9F7;text-decoration:line-through}
.co{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:14px;font-weight:600;color:#14201A}
.co.on{border:2px solid #14201A;padding:0 11px}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid #CBD5CE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14201A; background: #F4F6F3; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 52px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><h1 style="margin: 0; font-size: 20px; font-weight: 700">Fatura #00938</h1><button onClick="{{toggleEx}}" style="min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid #CBD5CE; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #14201A">{{exLbl}}</button></div>
<label style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 12px; border: 1px solid #CBD5CE; border-radius: 12px; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56645C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Kërko artikullin</span><input type="text" placeholder="Skano etiketën ose kërko" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; background: transparent; color: #14201A"></label>
</header>
<div style="flex: 1; overflow-y: auto; padding: 12px 16px">
<div style="background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 14px; padding: 0 14px">
<sc-if value="{{ex}}" hint-placeholder-val="{{ false }}">
<div class="ln" style="border-top: 0"><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14px">Kthehet: Bluzë pambuku</strong><span style="font-size: 12px; color: #9A3412">M · E bardhë · #00921</span></span><strong style="color: #9A3412">−€19.00</strong></div>
<div class="ln"><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14px">Merret: Bluzë pambuku</strong><span style="font-size: 12px; color: #56645C">L · E bardhë · ndërrim</span></span><strong>€19.00</strong></div>
</sc-if>
<div class="ln"><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14px">Xhinse slim fit</strong><span style="font-size: 12px; color: #56645C">30/32 · Blu e errët</span></span><strong>€45.00</strong></div>
<div class="ln"><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14px">Atlete të bardha</strong><span style="font-size: 12px; color: #56645C">Nr. 38</span></span><strong>€55.00</strong></div>
</div>
<button onClick="{{openPick}}" style="margin-top: 12px; width: 100%; min-height: 52px; border-radius: 12px; border: 2px dashed #0E6B4E; background: #F0F7F3; font: inherit; font-size: 15px; font-weight: 600; color: #0E6B4E">+ Shto artikull</button>
</div>
<div style="background: #FFFFFF; border-top: 1px solid #E2E7E3; padding: 12px 16px 28px; display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #56645C">Totali</span><span style="font-size: 22px; font-weight: 700">€100.00</span></span>
<button style="flex: 1; min-height: 52px; border-radius: 12px; border: 0; background: #0E6B4E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Paguaj</button>
</div>

<sc-if value="{{pick}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(16,36,27,.5); display: flex; flex-direction: column; justify-content: flex-end">
<section role="dialog" aria-modal="true" aria-labelledby="mbp-t" style="background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="display: flex; flex-direction: column"><h2 id="mbp-t" style="margin: 0; font-size: 18px; font-weight: 700">Xhinse slim fit</h2><span style="font-size: 13px; color: #56645C">€45.00</span></div><button onClick="{{closePick}}" aria-label="Mbyll" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #F0F3F1; font: inherit; font-size: 20px; color: #33413A">×</button></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700">Ngjyra</span><div style="display: flex; gap: 8px"><button class="co on"><span class="sw" style="background: #1E3A5F"></span>Blu e errët</button><button class="co"><span class="sw" style="background: #111111"></span>E zezë</button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700">Madhësia</span><div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px"><button class="sz">28</button><button class="sz">29</button><button class="sz on">30</button><button class="sz" disabled>31</button><button class="sz">32</button></div><span style="font-size: 12px; color: #56645C">30/32 · 3 copë në stok</span></div>
<button onClick="{{closePick}}" style="min-height: 54px; border-radius: 12px; border: 0; background: #0E6B4E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Shto në faturë</button>
</section>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { pick: true, ex: false }; }
renderVals() {
return {
pick: this.state.pick, ex: this.state.ex, exLbl: this.state.ex ? 'Hiq ndërrimin' : 'Ndërrim',

openPick: () => this.setState({ pick: true }), closePick: () => this.setState({ pick: false }),
toggleEx: () => this.setState({ ex: !this.state.ex })
};
}
}
</script>
</body>
</html>
