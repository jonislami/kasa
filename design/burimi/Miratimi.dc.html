<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Miratimi i menaxherit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#7F8C85}
a{color:#0E6B4E}a:hover{color:#0A5039}
.key{min-height:60px;border-radius:12px;border:1px solid #E2E7E3;background:#FFFFFF;font:inherit;font-size:22px;font-weight:600;color:#14201A}
.key:hover{background:#F0F3F1}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #CBD5CE;box-sizing:border-box}
.dot.on{background:#0E6B4E;border-color:#0E6B4E}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0}
.kv span:first-child{color:#56645C}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #14201A; min-height: 100vh; background: #7F8C85; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box">
<section role="dialog" aria-modal="true" aria-labelledby="mr-t" style="width: 100%; max-width: 460px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 30px 80px rgba(16,36,27,.35); padding: 26px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #FEF3C7; color: #854D0E; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
<h1 id="mr-t" style="margin: 0; font-size: 22px; font-weight: 700">Kërkohet PIN-i i menaxherit</h1>
<span style="font-size: 14px; color: #56645C">Granit Berisha kërkon të anulojë një faturë</span>
</div>
<div style="background: #F7F9F7; border-radius: 12px; padding: 8px 14px">
<div class="kv"><span>Veprimi</span><strong style="color: #9A3412">Anulim i faturës</strong></div>
<div class="kv"><span>Fatura</span><strong>#01281 · €18.90</strong></div>
<div class="kv"><span>Arsyeja</span><span>Gabim në arkë</span></div>
<div class="kv"><span>Arka · ora</span><span>Arka 2 · 10:58</span></div>
</div>

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #33413A">Menaxheri<select style="min-height: 46px; border: 1px solid #CBD5CE; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201A; background: #FFFFFF"><option>Arben Krasniqi (pronari)</option></select></label>
<div style="display: flex; justify-content: center; gap: 16px; padding: 4px 0" aria-label="{{pinLbl}}"><span class="dot {{d1}}"></span><span class="dot {{d2}}"></span><span class="dot {{d3}}"></span><span class="dot {{d4}}"></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button class="key" onClick="{{tap}}">1</button><button class="key" onClick="{{tap}}">2</button><button class="key" onClick="{{tap}}">3</button>
<button class="key" onClick="{{tap}}">4</button><button class="key" onClick="{{tap}}">5</button><button class="key" onClick="{{tap}}">6</button>
<button class="key" onClick="{{tap}}">7</button><button class="key" onClick="{{tap}}">8</button><button class="key" onClick="{{tap}}">9</button>
<button class="key" onClick="{{clear}}" style="font-size: 15px; color: #56645C">Fshi</button><button class="key" onClick="{{tap}}">0</button><button class="key" onClick="{{tap}}" style="font-size: 15px; background: #0E6B4E; border-color: #0E6B4E; color: #FFFFFF">Mirato</button>
</div>
<div style="display: flex; justify-content: space-between; gap: 10px">
<a href="Regjistri.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 10px; border: 1px solid #F3C9A8; color: #9A3412; text-decoration: none; font-size: 14px; font-weight: 600">Refuzo</a>
<button style="flex: 1.4; min-height: 46px; border-radius: 10px; border: 1px solid #CBD5CE; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #14201A">Dërgo në telefonin e menaxherit</button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; background: #E3F1EA; border-radius: 14px; padding: 20px; text-align: center; color: #0F2A1F">
<strong style="font-size: 18px">U miratua nga Arben Krasniqi</strong>
<span style="font-size: 13px">Fatura #01281 u anulua dhe veprimi u ruajt në regjistër.</span>
</div>
<button onClick="{{clear}}" style="min-height: 50px; border-radius: 12px; border: 0; background: #14201A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">Mbyll</button>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { n: 2 }; }
renderVals() {
const n = this.state.n;
const done = n >= 4;
return {
d1: n >= 1 ? 'on' : '', d2: n >= 2 ? 'on' : '', d3: n >= 3 ? 'on' : '', d4: n >= 4 ? 'on' : '',
pinLbl: 'PIN-i: ' + Math.min(n, 4) + ' nga 4 shifra', done, notDone: !done,
tap: () => this.setState({ n: Math.min(4, n + 1) }), clear: () => this.setState({ n: 0 })
};
}
}
</script>
</body>
</html>
