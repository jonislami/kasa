<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Sallon – Arka</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F3}
a{color:#0E6B4E}a:hover{color:#0A5039}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#C9D6CF;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1B3A2C;color:#FFFFFF}
.nav.on{background:#E3F1EA;color:#0F2A1F}
.st{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:14px;font-weight:600;color:#14201A}
.st.on{border:2px solid #14201A;padding:0 13px 0 5px}
.av{width:32px;height:32px;border-radius:50%;color:#FFFFFF;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sv{border:1px solid #E2E7E3;background:#FFFFFF;border-radius:12px;padding:14px;text-align:left;font:inherit;color:#14201A;display:flex;flex-direction:column;gap:6px;min-height:104px}
.sv:hover{border-color:#0E6B4E}
.ln{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #EEF1EE}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px 0 4px;border-radius:999px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:12px;font-weight:600;color:#14201A}
.dot{width:22px;height:22px;border-radius:50%;color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k1{background:#7C3AED}.k2{background:#BE185D}.k3{background:#0369A1}
</style>
</helmet>

<nav aria-label="Menuja kryesore" style="flex: 1 1 232px; background: #10241B; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 24px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #3FBF86; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10241B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg></div>
<div style="display: flex; flex-direction: column"><span style="color: #FFFFFF; font-weight: 700; font-size: 16px">Sallon Bukuria</span><span style="color: #8FA79A; font-size: 12px">Arka 1 · e hapur</span></div>
</div>

<a href="S-Arka.dc.html" class="nav on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/></svg>Arka</a>
<a href="S-Punetoret.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/></svg>Punëtorët</a>
<a href="Raportet.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Raportet</a>
<div style="flex-grow: 1; min-height: 24px"></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-label="Shërbimet" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div role="group" aria-label="Punëtori" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 14px; font-weight: 600; color: #56645C; margin-right: 4px">Punëtori:</span>
<button class="st {{c.a}}" aria-pressed="{{p.a}}" onClick="{{pick.a}}"><span class="av k1">A</span>Arta</button>
<button class="st {{c.b}}" aria-pressed="{{p.b}}" onClick="{{pick.b}}"><span class="av k2">B</span>Blerina</button>
<button class="st {{c.d}}" aria-pressed="{{p.d}}" onClick="{{pick.d}}"><span class="av k3">D</span>Dren</button>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; background: #FFFFFF; border: 2px solid #0E6B4E; border-radius: 12px; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56645C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Kërko shërbimin</span><input type="text" placeholder="Kërko shërbimin ose produktin…" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent; color: #14201A; min-width: 0"></label>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px">
<button class="sv"><span style="font-size: 12px; color: #56645C">Flokë</span><span style="font-size: 14px; font-weight: 600">Prerje &amp; fen</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€15.00</strong><span style="font-size: 12px; color: #56645C">45 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Flokë</span><span style="font-size: 14px; font-weight: 600">Ngjyrosje flokësh</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€35.00</strong><span style="font-size: 12px; color: #56645C">90 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Flokë</span><span style="font-size: 14px; font-weight: 600">Fen me valë</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€12.00</strong><span style="font-size: 12px; color: #56645C">60 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Thonj</span><span style="font-size: 14px; font-weight: 600">Manikyr me xhel</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€20.00</strong><span style="font-size: 12px; color: #56645C">60 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Thonj</span><span style="font-size: 14px; font-weight: 600">Pedikyr</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€18.00</strong><span style="font-size: 12px; color: #56645C">60 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Fytyrë</span><span style="font-size: 14px; font-weight: 600">Vetulla &amp; qerpikë</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€12.00</strong><span style="font-size: 12px; color: #56645C">45 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Grim</span><span style="font-size: 14px; font-weight: 600">Grim për dasmë</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€45.00</strong><span style="font-size: 12px; color: #56645C">90 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Berber</span><span style="font-size: 14px; font-weight: 600">Prerje meshkuj</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€6.00</strong><span style="font-size: 12px; color: #56645C">30 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Berber</span><span style="font-size: 14px; font-weight: 600">Prerje &amp; mjekër</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€9.00</strong><span style="font-size: 12px; color: #56645C">45 min</span></span></button>
<button class="sv"><span style="font-size: 12px; color: #56645C">Produkt</span><span style="font-size: 14px; font-weight: 600">Shampo profesionale 250ml</span><span style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px">€8.50</strong><span style="font-size: 12px; color: #56645C">14 copë</span></span></button>
</div>
</section>

<aside aria-labelledby="sa-c" style="flex: 1 1 380px; max-width: 100%; background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 16px; display: flex; flex-direction: column; box-sizing: border-box">
<div style="padding: 18px 20px; border-bottom: 1px solid #EEF1EE; display: flex; flex-direction: column; gap: 2px"><h2 id="sa-c" style="margin: 0; font-size: 17px; font-weight: 700">Fatura #00612</h2><span style="font-size: 12px; color: #56645C">Klientja: Donika Shala · termini 11:00</span></div>
<div style="padding: 4px 20px; display: flex; flex-direction: column">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div class="ln"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">{{l.name}}</span><span><button class="pill" onClick="{{l.cycle}}" aria-label="Ndrysho punëtorin për {{l.name}}"><span class="dot {{l.k}}">{{l.ini}}</span>{{l.staff}} ▾</button></span></span><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{l.price}}</span></div>
</sc-for>
</div>
<div style="margin-top: auto; padding: 16px 20px; background: #F7F9F7; border-top: 1px solid #EEF1EE; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<div style="display: flex; justify-content: space-between; color: #56645C"><span>Pa TVSH</span><span>€30.08</span></div>
<div style="display: flex; justify-content: space-between; color: #56645C"><span>TVSH 18%</span><span>€5.42</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px dashed #CBD5CE"><span style="font-size: 16px; font-weight: 600">Totali</span><span style="font-size: 32px; font-weight: 700">€35.50</span></div>
</div>
<div style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button style="min-height: 48px; border-radius: 10px; border: 2px solid #0E6B4E; background: #E3F1EA; font: inherit; font-size: 14px; font-weight: 600; color: #0F2A1F">Kesh</button><button style="min-height: 48px; border-radius: 10px; border: 1px solid #CBD5CE; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #14201A">Kartelë</button></div>
<button style="min-height: 60px; border-radius: 12px; border: 0; background: #0E6B4E; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700">Paguaj €35.50</button>
</div>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cur: 'a', ls: ['a', 'b', 'a'] }; }
renderVals() {
const S = { a: ['Arta', 'A', 'k1'], b: ['Blerina', 'B', 'k2'], d: ['Dren', 'D', 'k3'] };
const order = ['a', 'b', 'd'];
const base = [['Prerje & fen', '€15.00'], ['Vetulla & qerpikë', '€12.00'], ['Shampo profesionale 250ml', '€8.50']];
const c = {}, p = {}, pick = {};
order.forEach((k) => { c[k] = this.state.cur === k ? 'on' : ''; p[k] = this.state.cur === k ? 'true' : 'false'; pick[k] = () => this.setState({ cur: k }); });
const lines = base.map((b, i) => {
const s = S[this.state.ls[i]];
return { name: b[0], price: b[1], staff: s[0], ini: s[1], k: s[2],
cycle: () => { const ls = this.state.ls.slice(); ls[i] = order[(order.indexOf(ls[i]) + 1) % 3]; this.setState({ ls }); } };
});
return { c, p, pick, lines };
}
}
</script>
</body>
