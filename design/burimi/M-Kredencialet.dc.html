<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Telefon – Të dhënat për hyrje</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B4E}a:hover{color:#0A5039}
.lb{font-size:11px;font-weight:600;color:#56645C;letter-spacing:.04em}
.box{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 6px 0 12px;border:1px solid #CBD5CE;border-radius:10px;background:#F7F9F7}
.mono{flex:1;min-width:0;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#14201A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{min-height:40px;padding:0 10px;border-radius:8px;border:1px solid #CBD5CE;background:#FFFFFF;font:inherit;font-size:12px;font-weight:600;color:#14201A;white-space:nowrap}
.cp.done{border-color:#A7D7C0;background:#E3F1EA;color:#0E6B4E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14201A; background: #10241B; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 52px; flex-shrink: 0"></div>
<section role="dialog" aria-modal="true" aria-labelledby="mk-t" style="flex: 1; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="padding: 28px 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 50%; background: #E3F1EA; color: #0E6B4E; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
<h1 id="mk-t" style="margin: 0; font-size: 20px; font-weight: 700">Market Lisi u krijua</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #56645C">Dërgoja këto të dhëna Blerim Hasanit.</p>
</div>
<div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 5px"><span class="lb">ADRESA</span><div class="box"><span class="mono">[adresa e aplikacionit]</span><button class="cp {{cls.url}}" onClick="{{copy.url}}">{{lbl.url}}</button></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><span class="lb">EMAIL-I</span><div class="box"><span class="mono">blerim@marketlisi.com</span><button class="cp {{cls.email}}" onClick="{{copy.email}}">{{lbl.email}}</button></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><span class="lb">FJALËKALIMI</span><div class="box" style="border-color: #0E6B4E; background: #F0F7F3"><span class="mono" style="font-size: 18px; letter-spacing: .06em">Kx7#mP2vQa</span><button class="cp {{cls.pw}}" onClick="{{copy.pw}}">{{lbl.pw}}</button></div></div>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #9A3412; background: #FFEDE0; border-radius: 10px; padding: 10px"><strong>Fjalëkalimi nuk shfaqet më</strong> pas mbylljes. Kopjoje ose dërgoje tani.</p>
</div>
<footer style="margin-top: auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 8px">
<button onClick="{{copy.all}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 12px; border: 0; background: #0F7A40; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.7-5A9 9 0 1 1 8 19.3L3 21z"/></svg>Dërgo në WhatsApp</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button class="cp {{cls.all}}" onClick="{{copy.all}}" style="min-height: 48px; font-size: 14px">{{lbl.all}}</button>
<a href="M-Platforma.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 8px; background: #14201A; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700">Mbyll</a>
</div>
</footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { done: {} }; }
renderVals() {
const keys = ['url', 'email', 'pw', 'all'];
const base = { url: 'Kopjo', email: 'Kopjo', pw: 'Kopjo', all: 'Kopjo të gjitha' };
const cls = {}, lbl = {}, copy = {};
keys.forEach((k) => {
const d = !!this.state.done[k];
cls[k] = d ? 'done' : '';
lbl[k] = d ? 'U kopjua ✓' : base[k];
copy[k] = () => this.setState({ done: { ...this.state.done, [k]: true } });
});
return { cls, lbl, copy };
}
}
</script>
</body>
</html>
