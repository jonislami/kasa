<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Telefon – Miratimi i menaxherit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.key{min-height:56px;border-radius:12px;border:1px solid #E2E7E3;background:#FFFFFF;font:inherit;font-size:22px;font-weight:600;color:#14201A}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #CBD5CE;box-sizing:border-box}
.dot.on{background:#0E6B4E;border-color:#0E6B4E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14201A; background: #10241B; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 52px; flex-shrink: 0"></div>
<section role="dialog" aria-modal="true" aria-labelledby="mm-t" style="flex: 1; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #FEF3C7; color: #854D0E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span style="display: flex; flex-direction: column"><h1 id="mm-t" style="margin: 0; font-size: 18px; font-weight: 700">Kërkohet PIN-i i menaxherit</h1><span style="font-size: 13px; color: #56645C">Granit B. · anulim i #01281 · €18.90</span></span></div>
<div style="background: #F7F9F7; border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; justify-content: space-between"><span style="color: #56645C">Arsyeja</span><span>Gabim në arkë · Arka 2 · 10:58</span></div>
<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: center; gap: 16px; padding: 6px 0" aria-label="{{pinLbl}}"><span class="dot {{d1}}"></span><span class="dot {{d2}}"></span><span class="dot {{d3}}"></span><span class="dot {{d4}}"></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button class="key" onClick="{{tap}}">1</button><button class="key" onClick="{{tap}}">2</button><button class="key" onClick="{{tap}}">3</button>
<button class="key" onClick="{{tap}}">4</button><button class="key" onClick="{{tap}}">5</button><button class="key" onClick="{{tap}}">6</button>
<button class="key" onClick="{{tap}}">7</button><button class="key" onClick="{{tap}}">8</button><button class="key" onClick="{{tap}}">9</button>
<button class="key" onClick="{{clear}}" style="font-size: 14px; color: #56645C">Fshi</button><button class="key" onClick="{{tap}}">0</button><button class="key" onClick="{{tap}}" style="font-size: 14px; background: #0E6B4E; border-color: #0E6B4E; color: #FFFFFF">Mirato</button>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><a href="M-Regjistri.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; border: 1px solid #F3C9A8; color: #9A3412; text-decoration: none; font-size: 14px; font-weight: 600">Refuzo</a><button style="min-height: 48px; border-radius: 10px; border: 1px solid #CBD5CE; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #14201A">Dërgo te menaxheri</button></div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: #E3F1EA; border-radius: 14px; padding: 20px; text-align: center; color: #0F2A1F"><strong style="font-size: 17px">U miratua nga Arben Krasniqi</strong><span style="font-size: 13px">#01281 u anulua · u ruajt në regjistër</span></div>
<button onClick="{{clear}}" style="margin-top: auto; min-height: 52px; border-radius: 12px; border: 0; background: #14201A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">Mbyll</button>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { n: 2 }; }
renderVals() {
const n = this.state.n; const done = n >= 4;
return { d1: n >= 1 ? 'on' : '', d2: n >= 2 ? 'on' : '', d3: n >= 3 ? 'on' : '', d4: n >= 4 ? 'on' : '', pinLbl: 'PIN-i: ' + Math.min(n, 4) + ' nga 4 shifra', done, notDone: !done,
tap: () => this.setState({ n: Math.min(4, n + 1) }), clear: () => this.setState({ n: 0 }) };
}
}
</script>
</body>
</html>
